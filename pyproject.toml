[project]
name = "barlow-track-env"
version = "0.1.0"
description = "A python environment for running Zimmer-lab pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "3deecelltracker",
    "backports-cached-property>=1.0.2",
    "barlow-track",
    "dask>=2026.1.2",
    "hdbscan>=0.8.41",
    "hdf5plugin>=6.0.0",
    "imutils",
    "lindi>=0.4.5",
    "lmfit>=1.3.4",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "methodtools>=0.4.7",
    "ndstorage>=0.1.18",
    "ndx-multichannel-volume",
    "numba>=0.63.1",
    "numpy<2",
    "nwbinspector>=0.6.5",
    "opencv-python-headless",
    "pip>=26.0.1",
    "plotly>=6.5.2",
    "pynndescent>=0.6.0",
    "pynwb>=3.1.3",
    "pytorch-lightning>=2.3.3",
    "ruamel-yaml>=0.19.1",
    "sacred>=0.8.7",
    "scikit-image",
    "scikit-learn",
    "setuptools<81",
    "stardist>=0.9.1",
    "statsmodels>=0.14.6",
    "tables>=3.10.2",
    "tensorflow>=2.18.1 ; sys_platform == 'win32'",
    "tensorflow[and-cuda]>=2.18.1 ; sys_platform == 'linux'",
    "torch>=2.0.1",
    "torch-cluster",
    "torch-geometric",
    "torch-scatter",
    "torch-sparse",
    "torchvision",
    "tqdm>=4.67.3",
    "wandb>=0.24.2",
    "wbfm",
]

[tool.uv.sources]
wbfm = { git = "https://github.com/lycantrope/wbfm", rev = "main" }
barlow-track = { git = "https://github.com/Zimmer-lab/barlow_track", rev = "main" }
imutils = { git = "https://github.com/Zimmer-lab/imutils", rev = "master" }
ndx-multichannel-volume = { git = "https://github.com/focolab/ndx-multichannel-volume" }
3deecelltracker = { git = "https://github.com/lycantrope/3DeeCellTracker" }

[tool.uv.extra-build-dependencies]
torch-sparse = ["torch"]
torch-scatter = ["torch"]
torch-cluster = ["torch"]

[dependency-groups]
dev = ["ipykernel>=7.1.0", "ruff>=0.15.0", "traitlets>=5.14.3"]
